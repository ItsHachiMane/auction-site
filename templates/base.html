<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Auction Site{% endblock %}</title>
  <style>
    :root {
      --bg: #050816;
      --panel: #0f172a;
      --panel-2: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #1f2937;
      --accent: #38bdf8;
      --accent-2: #60a5fa;
      --good: #14b8a6;
    }
    body { font-family: system-ui, sans-serif; margin: 0; background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 60%); color: var(--text); }
    nav, main { max-width: 960px; margin: 0 auto; padding: 16px; }
    nav { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card { background: linear-gradient(180deg, var(--panel), var(--panel-2)); padding: 16px; border: 1px solid var(--line); border-radius: 14px; margin: 16px 0; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    input, textarea, select { width: 100%; max-width: 420px; padding: 10px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid var(--line); background: #020617; color: var(--text); }
    button { width: 100%; max-width: 220px; padding: 10px; border-radius: 10px; border: none; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #04111f; font-weight: 700; cursor: pointer; }
    button:hover { filter: brightness(1.06); }
    img { border-radius: 10px; margin: 6px; border: 1px solid var(--line); }
    ul { padding-left: 18px; }
    .msg { background: rgba(20, 184, 166, 0.15); border: 1px solid rgba(20, 184, 166, 0.35); padding: 10px 12px; border-radius: 8px; margin: 12px 0; color: #99f6e4; }
    p { color: var(--muted); }
    h1, h2, h3, strong, label { color: var(--text); }
  </style>
</head>
<body>
  <nav>
    <div><strong>Auction Site</strong></div>
    <div>
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'auction_list' %}">Auctions</a>
      {% if user.is_authenticated %}
        <a href="{% url 'my_history' %}">My History</a>
        <span> · {{ user.username }}</span>
        <a href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% if messages %}
      {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
